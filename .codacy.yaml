# Codacy configuration: ignore files and folders not relevant for code quality analysis
# Adjust this list to your needs. Globs are relative to the repository root.
# Docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Only specifying exclusions as requested. No engine overrides here.
exclude_paths:
  # Dependencies and vendor code
  - vendor/**
  - node_modules/**

  # Build artifacts, caches, logs, and runtime data
  - var/**
  - public/build/**
  - public/bundles/**
  - public/assets/**
  - public/*.map

  # Database migrations (often autogenerated and noisy for linters)
  - migrations/**

    # Binaries and scripts not meant for static analysis
  - bin/**
  - scripts/**

    # tests not meant for static analysis
  - tests/**

    # Lock files and metadata
  - composer.lock
  - symfony.lock
  - package-lock.json
